<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-icon"></span>
            <img src="img/logo.svg" alt="Логотип">
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Главная</a></li>
                <li><a href="2.html">Курсы</a></li>
                <li><a href="3.html">О нас</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner">
            <div class="container">
                <div class="banner-content">
                    <h1>Начни говорить<br>на новом языке</h1>
                    <p>Онлайн-курсы с носителями языка. От A1 до C2.<br>Гибкий график, живая практика, сертификат.</p>

                    <div class="banner-buttons">
                        <a href="2.html" class="btn1">Начать учиться</a>
                        <a href="3.html" class="btn2">Подробнее</a>
                    </div>

                    <div class="banner-stats">
                        <div class="stat-box">
                            <span class="number">15 000+</span>
                            <span class="label">учеников</span>
                        </div>
                        <div class="stat-box">
                            <span class="number">120+</span>
                            <span class="label">преподавателей</span>
                        </div>
                        <div class="stat-box">
                            <span class="number">4.9 ★</span>
                            <span class="label">рейтинг</span>
                        </div>
                    </div>
                </div>

                <div class="banner-image">
                    <img src="img/banner-image.png" alt="Иллюстрация курса">
                </div>
            </div>
        </section>

        
    </main>

    <footer>
        <nav></nav>
    </footer>

</html>
